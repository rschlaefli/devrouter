name: Devrouter installation sweep
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  sweep:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    uses: rschlaefli/devrouter/.github/workflows/preview.yml@__CONTROLLER_REF__
    with:
      controller-ref: __CONTROLLER_REF__
      policy-repository: __POLICY_REPOSITORY__
      policy-ref: __POLICY_REF__
      installation: __INSTALLATION__
      mode: sweep
      azure-client-id: ${{ vars.DEVROUTER_PREVIEW_AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.DEVROUTER_PREVIEW_AZURE_TENANT_ID }}
    secrets:
      policy-read-token: ${{ secrets.DEVROUTER_PREVIEW_POLICY_READ_TOKEN }}
      credentials: ${{ secrets.DEVROUTER_PREVIEW_CREDENTIALS }}
