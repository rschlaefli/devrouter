name: Devrouter previews
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed, synchronize, reopened]
  workflow_dispatch:
    inputs:
      change:
        description: PR number
        type: string
        required: true
# Install a separate central caller with mode=sweep and a */5 schedule once per installation.
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview ')) ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    uses: rschlaefli/devrouter/.github/workflows/preview.yml@__CONTROLLER_REF__
    with:
      controller-ref: __CONTROLLER_REF__
      policy-repository: __POLICY_REPOSITORY__
      policy-ref: __POLICY_REF__
      installation: __INSTALLATION__
      project: __PROJECT__
      change: ${{ format('{0}', github.event.issue.number || github.event.pull_request.number || inputs.change) }}
      azure-client-id: ${{ vars.DEVROUTER_PREVIEW_AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.DEVROUTER_PREVIEW_AZURE_TENANT_ID }}
    secrets:
      policy-read-token: ${{ secrets.DEVROUTER_PREVIEW_POLICY_READ_TOKEN }}
      credentials: ${{ secrets.DEVROUTER_PREVIEW_CREDENTIALS }}
