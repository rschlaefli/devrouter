name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current ref to npm
        required: false
        default: false
        type: boolean
      harness_journey:
        description: Run the opt-in enforcing harness journey against its local mock model
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs-policy
      - run: pnpm check:knowledge
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      - run: pnpm qualify:controller
        timeout-minutes: 5
      - run: pnpm qualify:capacity
        timeout-minutes: 5

  harness-journey:
    # Opt-in qualification of the real agent-harness journey. The journey drives
    # an actual harness CLI against its own local mock model API, so it needs no
    # credentials, provider access or model spend. It stays out of ordinary
    # pushes because it installs a harness CLI and takes several minutes. The
    # script exits 3 when a prerequisite is unavailable and the job fails on
    # purpose: an unrun cell is not acceptance.
    if: github.event_name == 'workflow_dispatch' && inputs.harness_journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the harness CLI
        run: npm install --global @anthropic-ai/claude-code@2
      - name: Run the enforcing harness journey
        env:
          DR_JOURNEY_HARNESS: claude
          DR_JOURNEY_EVIDENCE: harness-journey-evidence.json
        run: pnpm qualify:harness-journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-journey-evidence
          path: harness-journey-evidence.json
          if-no-files-found: warn

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish package
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            pnpm publish --no-git-checks --access public
          else
            pnpm publish --no-git-checks --access public --provenance
          fi
